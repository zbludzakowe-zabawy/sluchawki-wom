    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    (function () {
      var KEY = 'zz-analytics-consent', GTM = 'GTM-PKVQBH86';
      var get = function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
      var set = function (v) { try { localStorage.setItem(KEY, v); } catch (e) {} };
      function load() {
        if (window.__gtmLoaded) return; window.__gtmLoaded = true;
        gtag('js', new Date());
        dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
        var s = document.createElement('script'); s.async = true;

      function banner() {

        var t = pl
          ? ['Ta strona używa plików cookie Google Analytics, żeby liczyć odwiedziny. Zgadzasz się?', 'Zgadzam się', 'Nie, dziękuję']
          : ['This site uses Google Analytics cookies to count visits. Do you agree?', 'Accept', 'No, thanks'];

          + '#zz-consent button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #888;background:transparent;color:inherit;cursor:pointer}'
          + '#zz-consent button.zz-ok{background:#2563eb;border-color:#2563eb;color:#fff}'

      window.zzConsent = function () { try { localStorage.removeItem(KEY); } catch (e) {} banner(); };
      var c = get();
      if (c === 'granted') load();
      else if (c !== 'denied') {
        if (document.body) banner(); else document.addEventListener('DOMContentLoaded', banner);
      }
    })();
