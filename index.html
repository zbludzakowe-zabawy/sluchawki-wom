<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Słuchawki – Kanony na WOM. Nauka rozpoznawania utworów ze słuchu: słuchanie po kolei i losowo, quizy wyboru i tekstowe.">
  <meta name="theme-color" content="#2b2768">
  <title>Słuchawki – Kanony na WOM</title>
  <meta name="application-name" content="Słuchawki">
  <meta name="apple-mobile-web-app-title" content="Słuchawki">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Wstecz" hidden>‹</button>
    <a class="brand" href="#/">
      <img src="icons/icon-192.png" alt="" width="34" height="34">
      <span><strong>Słuchawki</strong><small id="hdr-sub">Kanony na WOM</small></span>
    </a>
    <span class="offline-dot" title="Brak internetu">offline</span>
    <button class="icon-btn" id="btn-settings" aria-label="Ustawienia">⚙</button>
  </header>

  <main id="view" class="view"></main>

  <div class="mini" id="mini" hidden>
    <button class="round sm" id="mini-play" aria-label="Odtwórz / pauza">⏸</button>
    <button class="mini-title" id="mini-open"><span id="mini-title"></span></button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <audio id="audio" preload="auto"></audio>

  <div class="app-banner" id="install-banner" hidden>
    <img src="icons/icon-192.png" alt="" width="40" height="40">
    <div class="app-banner-text">
      <strong>Zainstaluj Słuchawki</strong>
      <span class="only-prompt">Aplikacja na ekranie głównym, działa też bez internetu.</span>
      <span class="only-ios">Stuknij <b>Udostępnij</b> <svg class="share-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>, potem <b>Do ekranu początkowego</b>.</span>
    </div>
    <button class="btn primary only-prompt" id="btn-install">Zainstaluj</button>
    <button class="banner-close" id="btn-install-close" aria-label="Nie pokazuj więcej">✕</button>
  </div>
  <div class="app-banner" id="update-banner" role="alert" hidden>
    <div class="app-banner-text">
      <strong>Dostępna nowa wersja</strong>
      <span>Twoje zbiory i postęp zostaną zachowane.</span>
    </div>
    <button class="btn primary" id="btn-update">Odśwież</button>
    <button class="btn" id="btn-update-later">Później</button>
  </div>

  <script src="js/pwa.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
