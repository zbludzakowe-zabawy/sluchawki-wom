name: Publikacja (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy
        run: npm test
      - name: Katalog strony
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest sw.js js icons _site/
          rm -f _site/icons/icon.svg
          if [ -d zbiory ]; then mkdir -p _site/zbiory && cp zbiory/*.json _site/zbiory/ 2>/dev/null || true; fi
          node tools/build-library.mjs _site
          node tools/build-sw.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
